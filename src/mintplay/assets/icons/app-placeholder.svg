<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111A1A"/>
      <stop offset="100%" stop-color="#1B2827"/>
    </linearGradient>
    <linearGradient id="mintGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#79D6B4"/>
      <stop offset="100%" stop-color="#46B48F"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Fondo redondeado suave -->
  <rect x="16" y="16" width="224" height="224" rx="48" fill="url(#bgGrad)" stroke="#283B39" stroke-width="4"/>

  <!-- Líneas fluidas de viento japonés -->
  <path d="M 40 85 C 80 75, 120 95, 160 85 C 190 78, 210 90, 220 95" 
        fill="none" stroke="#79D6B4" stroke-width="6" stroke-linecap="round" opacity="0.35"/>
        
  <path d="M 36 175 C 75 165, 110 185, 150 175 C 185 168, 205 178, 224 172" 
        fill="none" stroke="#79D6B4" stroke-width="6" stroke-linecap="round" opacity="0.35"/>

  <!-- Símbolo de reproducción estilizado como brisa -->
  <path d="M 100 86 C 100 80, 108 76, 114 80 L 176 122 C 182 126, 182 134, 176 138 L 114 180 C 108 184, 100 180, 100 174 Z" 
        fill="url(#mintGrad)" filter="url(#glow)"/>

  <!-- Detalle interior dinámico -->
  <circle cx="132" cy="130" r="10" fill="#EEF4F0" opacity="0.9"/>
</svg>
